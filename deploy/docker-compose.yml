services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: linguatrack
      POSTGRES_USER: linguatrack_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis для кэширования и Celery
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django приложение
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - BOT_API_TOKEN=${BOT_API_TOKEN:?BOT_API_TOKEN must be set}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - YANDEX_SPEECHKIT_FOLDER_ID=${YANDEX_SPEECHKIT_FOLDER_ID}
      - AUDIO_CACHE_TTL=${AUDIO_CACHE_TTL:-604800}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-tarmo.opencove.ru,localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://tarmo.opencove.ru}
      - TIME_ZONE=${TIME_ZONE:-UTC}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 lingua_track.wsgi:application"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Celery worker
  celery_worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must be set}
      - TELEGRAM_BOT_NOTIFY_URL=${TELEGRAM_BOT_NOTIFY_URL:-http://bot:8080/notify}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:?NOTIFY_API_TOKEN must be set}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - YANDEX_SPEECHKIT_FOLDER_ID=${YANDEX_SPEECHKIT_FOLDER_ID}
      - AUDIO_CACHE_TTL=${AUDIO_CACHE_TTL:-604800}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A lingua_track worker -l info

  # Celery beat (планировщик)
  celery_beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must be set}
      - YANDEX_SPEECHKIT_API_KEY=${YANDEX_SPEECHKIT_API_KEY}
      - YANDEX_SPEECHKIT_FOLDER_ID=${YANDEX_SPEECHKIT_FOLDER_ID}
      - AUDIO_CACHE_TTL=${AUDIO_CACHE_TTL:-604800}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: celery -A lingua_track beat -l info

  # Telegram-бот
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DJANGO_API_URL=${DJANGO_API_URL:-http://web:8000}
      - BOT_API_TOKEN=${BOT_API_TOKEN:?BOT_API_TOKEN must be set}
      - NOTIFY_API_TOKEN=${NOTIFY_API_TOKEN:?NOTIFY_API_TOKEN must be set}
    volumes:
      - media_data:/app/media
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Nginx для проксирования и статических файлов
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
